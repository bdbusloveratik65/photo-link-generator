<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Dictionary</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: #050505;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a237e 0%, #000 70%);
            z-index: -1;
            opacity: 0.6;
        }

        .container {
            width: 100%;
            max-width: 600px;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease forwards;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .premium-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .file-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #000;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.4s;
            clip-path: polygon(0% 0%, 92% 0%, 100% 30%, 100% 100%, 0% 100%);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .file-upload-btn:hover {
            background: #00f2fe;
            transform: skewX(-2deg);
        }

        input[type="file"] {
            display: none;
        }

        .preview-window {
            height: 200px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(255,255,255,0.15);
            margin-bottom: 20px;
            overflow: hidden;
            position: relative;
        }

        .preview-window img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: #00f2fe;
            border: 2px solid #00f2fe;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.4s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover:not(:disabled) {
            background: #00f2fe;
            color: #000;
            box-shadow: 0 0 20px #00f2fe;
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }

        .result-box {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .result-input-group {
            display: flex;
            gap: 10px;
        }

        .result-input {
            flex: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 242, 254, 0.4);
            padding: 12px;
            border-radius: 8px;
            color: #00f2fe;
            outline: none;
            font-size: 0.9rem;
        }

        .copy-btn {
            padding: 12px 20px;
            background: #00f2fe;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .copy-btn:hover {
            background: #fff;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="header">
            <h1>DIGITAL DICTIONARY</h1>
            <p style="color: #666; letter-spacing: 2px;">AUTOMATED IMAGE HOSTER</p>
        </div>

        <div class="premium-card">
            <label for="imageInput" class="file-upload-btn">
                📁 ফটো সিলেক্ট করুন 
            </label>
            <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">

            <div class="preview-window" id="previewBox">
                <span style="opacity: 0.3;">ফটো সিলেক্ট করলে এখানে দেখাবে</span>
            </div>

            <button class="action-btn" id="generateBtn" onclick="uploadToImgBB()" disabled>
                লিংক জেনারেট করুন
            </button>

            <div class="result-box" id="resultBox">
                <span style="font-size: 0.85rem; color: #aaa;">আপনার ছবির লিংক:</span>
                <div class="result-input-group">
                    <input type="text" id="imageUrlOutput" class="result-input" readonly>
                    <button class="copy-btn" onclick="copyLink()">কপি</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'ea8284407f0689742946d416020168f6';
        let selectedFile = null;

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewBox = document.getElementById('previewBox');
                    previewBox.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                    
                    const generateBtn = document.getElementById('generateBtn');
                    generateBtn.disabled = false;
                    generateBtn.innerText = 'লিংক জেনারেট করুন';
                    
                    document.getElementById('resultBox').style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        }

        function uploadToImgBB() {
            if (!selectedFile) return;

            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.innerText = 'আপলোড হচ্ছে...';

            const formData = new FormData();
            formData.append('image', selectedFile);

            fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const imageUrl = data.data.url;
                    document.getElementById('imageUrlOutput').value = imageUrl;
                    document.getElementById('resultBox').style.display = 'flex';
                    generateBtn.innerText = 'সফলভাবে জেনারেট হয়েছে!';
                } else {
                    alert('আপলোড ব্যর্থ হয়েছে! আবার চেষ্টা করুন।');
                    generateBtn.disabled = false;
                    generateBtn.innerText = 'লিংক জেনারেট করুন';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('কোথাও কোনো সমস্যা হয়েছে!');
                generateBtn.disabled = false;
                generateBtn.innerText = 'লিংক জেনারেট করুন';
            });
        }

        // আপডেট করা কপি ফাংশন (মোবাইল ফ্রেন্ডলি)
        function copyLink() {
            const copyText = document.getElementById('imageUrlOutput');
            
            copyText.select();
            copyText.setSelectionRange(0, 99999); // মোবাইল ডিভাইসের জন্য

            try {
                // ব্রাউজারের ব্যাকআপ বা ফলব্যাক মেথড যা লোকাল বা সাধারণ HTTP এও কাজ করে
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopiedFeedback();
                } else {
                    // আধুনিক ক্লিপবোর্ড এপিআই ট্রাই করবে যদি এক্সিকিউট কমান্ড ফেইল করে
                    navigator.clipboard.writeText(copyText.value).then(() => {
                        showCopiedFeedback();
                    }).catch(err => {
                        alert('কপি করতে সমস্যা হয়েছে, দয়া করে লিংকটি ম্যানুয়ালি কপি করুন।');
                    });
                }
            } catch (err) {
                alert('আপনার ব্রাউজার এটি সাপোর্ট করছে না।');
            }
        }

        function showCopiedFeedback() {
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerText = 'কপি হয়েছে!';
            copyBtn.style.background = '#fff';
            setTimeout(() => {
                copyBtn.innerText = 'কপি';
                copyBtn.style.background = '#00f2fe';
            }, 2000);
        }
    </script>
</body>
</html>
